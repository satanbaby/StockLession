name: Refresh TWSE data and deploy

on:
  schedule:
    # 週一到週五 08:00 UTC（台北 16:00，收盤後留足時間讓 TWSE 資料更新）。
    # 獨立的 concurrency group，跟 deploy.yml 的 push 觸發完全分開，
    # 不會互相取消、也不會拖慢一般版更的部署速度。
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch latest TWSE data
        run: pnpm fetch:twse

      - name: Type and content check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build site
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
